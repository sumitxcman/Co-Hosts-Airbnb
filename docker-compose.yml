version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cohosts_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cohosts
    ports:
      - "5432:5432"
    volumes:
      - cohosts_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  cohosts_postgres_data:
